<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="color-scheme" content="light dark"><title>Private Workspace</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f4ee,#151d1a);--fg:light-dark(#20372d,#e5ebe0);--sub:light-dark(#626d60,#acb9a8);--line:light-dark(#c5cdbf,#50654f);--accent:light-dark(#286247,#9bcc9f);--panel:light-dark(#fbfaf6,#23332a)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 20px}main{width:min(100%,430px)}.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--accent);font-weight:600}h1{font-family:'Songti SC',serif;font-size:36px;line-height:1.45;font-weight:500;letter-spacing:.015em;margin:18px 0}p{font-size:14px;line-height:1.85;color:var(--sub)}form{border-top:2px solid var(--accent);padding-top:27px;margin-top:28px}label{font-size:13px;display:block;margin-bottom:10px}.field{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}.field:focus-within{outline:2px solid var(--accent);outline-offset:3px}input{font:inherit;font-size:18px;letter-spacing:.15em;width:100%;min-width:0;border:0;background:transparent;padding:15px;color:var(--fg);outline:none}.show{border:0;background:transparent;color:var(--sub);padding:0 15px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}.submit{width:100%;min-height:50px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:inherit;font-size:15px;cursor:pointer;margin-top:15px}.submit:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.status{min-height:26px;margin:10px 0;font-size:12px;color:var(--sub)}footer{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;font-size:11px;line-height:1.8;color:var(--sub)}
</style></head><body><main><div class="eyebrow">PRIVATE WORKSPACE</div><h1>访问工作区</h1><p>输入访问密码，打开工作区。</p><form id="unlock"><label for="password">访问密码</label><div class="field"><input id="password" type="password" autocomplete="current-password" required inputmode="numeric" autofocus><button id="show" class="show" type="button" aria-label="显示密码">显示</button></div><button class="submit" id="submit" type="submit">解锁 →</button><p id="status" class="status" role="status" aria-live="polite"></p></form><footer>页面与数据加密保存，密码在浏览器内用于解锁。刷新页面后重新输入。</footer></main>
<script>
const config={"salt":"vGvv+PnZ3VUXS9l5F12r6A==","iv":"X8qRLTZu1amju2YA","iterations":600000,"payload":"payload.enc"};
const field=document.getElementById('password'),status=document.getElementById('status'),submit=document.getElementById('submit');
document.getElementById('show').addEventListener('click',e=>{const show=field.type==='password';field.type=show?'text':'password';e.target.textContent=show?'隐藏':'显示';e.target.setAttribute('aria-label',show?'隐藏密码':'显示密码')});
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();if(!field.value)return;submit.disabled=true;status.textContent='正在解锁…';const password=field.value;field.value='';
try{if(!crypto.subtle||!globalThis.DecompressionStream)throw new Error('browser');const response=await fetch(config.payload,{cache:'no-store'});if(!response.ok)throw new Error('network');const encrypted=await response.arrayBuffer();const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let compressed;try{compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(config.iv)},key,encrypted)}catch{throw new Error('password')}status.textContent='正在打开分析页面…';const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}
catch(err){status.textContent=err.message==='password'?'密码不正确，请重新输入。':err.message==='browser'?'请使用新版 Safari、Chrome 或 Edge 打开。':'加载失败，请检查网络后重试。';submit.disabled=false;field.focus();}});
</script></body></html>
